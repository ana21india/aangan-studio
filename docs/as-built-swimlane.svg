<text x="22" y="1140" font-size="13" fill="#333">* pricing.md is stored but never given to the live agent (pricing mode: none). Neon = system of record and dashboard data; HubSpot = sales pipeline view of contacts and deals.</text>
<text x="22" y="1162" font-size="13" fill="#333">Vaani runs the live conversation with its own AI and books with its Cal.com tools during the call; Gemini is called by API only after the call. Rules (category, budget, score) run in plain code.</text>
<text x="22" y="1184" font-size="13" fill="#333">SMS was not used: the plan&#x27;s &quot;Cal.com link sent by SMS&quot; became booking on the call itself, with a Telegram link as the fallback. Extension: WhatsApp and the web form join at the Input layer; everything downstream stays the same.</text>
