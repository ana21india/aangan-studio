<text x="234" y="115" font-size="10.8" text-anchor="middle" fill="#1d2939">Caller phones in</text>
<text x="234" y="130" font-size="10.8" text-anchor="middle" fill="#1d2939">(browser test now;</text>
<text x="234" y="145" font-size="10.8" text-anchor="middle" fill="#1d2939">real number later)</text>
<rect x="663" y="96" width="150" height="64" rx="8" fill="#fff4d6" stroke="#c9a227" stroke-width="1.6" />
<text x="738" y="115" font-size="10.8" text-anchor="middle" fill="#1d2939">Front-desk person</text>
<text x="738" y="130" font-size="10.8" text-anchor="middle" fill="#1d2939">gets the transfer</text>
<rect x="327" y="184" width="150" height="64" rx="8" fill="#efe7ff" stroke="#7a54d6" stroke-width="1.6" />
<text x="402" y="203" font-size="10.8" text-anchor="middle" fill="#1d2939">Answers live.</text>
<text x="402" y="218" font-size="10.8" text-anchor="middle" fill="#1d2939">Says: AI assistant,</text>
<text x="402" y="233" font-size="10.8" text-anchor="middle" fill="#1d2939">call is recorded</text>
<rect x="495" y="184" width="150" height="64" rx="8" fill="#efe7ff" stroke="#7a54d6" stroke-width="1.6" />
<text x="570" y="203" font-size="10.8" text-anchor="middle" fill="#1d2939">One question at a time.</text>
<text x="570" y="218" font-size="10.8" text-anchor="middle" fill="#1d2939">Gate check: real project,</text>
<text x="570" y="233" font-size="10.8" text-anchor="middle" fill="#1d2939">city, timeline, owner, budget</text>
<rect x="663" y="184" width="150" height="64" rx="8" fill="#efe7ff" stroke="#7a54d6" stroke-width="1.6" />
<text x="738" y="203" font-size="10.8" text-anchor="middle" fill="#1d2939">Fit: books a slot.</text>
<text x="738" y="218" font-size="10.8" text-anchor="middle" fill="#1d2939">Not a fit: kind close.</text>
<text x="738" y="233" font-size="10.8" text-anchor="middle" fill="#1d2939">Upset: transfers</text>
<rect x="831" y="184" width="150" height="64" rx="8" fill="#efe7ff" stroke="#7a54d6" stroke-width="1.6" />
<text x="906" y="203" font-size="10.8" text-anchor="middle" fill="#1d2939">Call ends. Sends events:</text>
<text x="906" y="218" font-size="10.8" text-anchor="middle" fill="#1d2939">started, transfer,</text>
<text x="906" y="233" font-size="10.8" text-anchor="middle" fill="#1d2939">post-processing</text>
<rect x="663" y="272" width="150" height="64" rx="8" fill="#e3f0ff" stroke="#3b82c4" stroke-width="1.6" />
<text x="738" y="291" font-size="10.8" text-anchor="middle" fill="#1d2939">Check free times</text>
<text x="738" y="306" font-size="10.8" text-anchor="middle" fill="#1d2939">and book the</text>
<text x="738" y="321" font-size="10.8" text-anchor="middle" fill="#1d2939">consultation</text>
<rect x="1167" y="272" width="150" height="64" rx="8" fill="#e3f0ff" stroke="#3b82c4" stroke-width="1.6" />
<text x="1242" y="291" font-size="10.8" text-anchor="middle" fill="#1d2939">Booking webhook:</text>
<text x="1242" y="306" font-size="10.8" text-anchor="middle" fill="#1d2939">created / cancelled</text>
<rect x="999" y="360" width="150" height="64" rx="8" fill="#dff5ea" stroke="#2f9e6e" stroke-width="1.6" />
<text x="1074" y="379" font-size="10.8" text-anchor="middle" fill="#1d2939">/webhooks/vaani/events</text>
<text x="1074" y="394" font-size="10.8" text-anchor="middle" fill="#1d2939">secret token checked,</text>
<text x="1074" y="409" font-size="10.8" text-anchor="middle" fill="#1d2939">answers 200 at once</text>
<rect x="1167" y="360" width="150" height="64" rx="8" fill="#dff5ea" stroke="#2f9e6e" stroke-width="1.6" />
<text x="1242" y="379" font-size="10.8" text-anchor="middle" fill="#1d2939">Pipeline: no duplicates,</text>
<text x="1242" y="394" font-size="10.8" text-anchor="middle" fill="#1d2939">merge repeat calls (60 min),</text>
<text x="1242" y="409" font-size="10.8" text-anchor="middle" fill="#1d2939">attach waiting booking</text>
<rect x="1503" y="360" width="150" height="64" rx="8" fill="#dff5ea" stroke="#2f9e6e" stroke-width="1.6" />
<text x="1578" y="379" font-size="10.8" text-anchor="middle" fill="#1d2939">Rules in code: budget,</text>
<text x="1578" y="394" font-size="10.8" text-anchor="middle" fill="#1d2939">category, score,</text>
<text x="1578" y="409" font-size="10.8" text-anchor="middle" fill="#1d2939">handoff note, costs</text>
<rect x="1335" y="448" width="150" height="64" rx="8" fill="#ffe7e2" stroke="#e0654d" stroke-width="1.6" />
<text x="1410" y="467" font-size="10.8" text-anchor="middle" fill="#1d2939">1. Extract the facts</text>
<text x="1410" y="482" font-size="10.8" text-anchor="middle" fill="#1d2939">2. Judge 4 criteria</text>
<text x="1410" y="497" font-size="10.8" text-anchor="middle" fill="#1d2939">(never on the call)</text>
<rect x="1167" y="536" width="150" height="64" rx="8" fill="#e8eaf0" stroke="#667085" stroke-width="1.6" />
<text x="1242" y="555" font-size="10.8" text-anchor="middle" fill="#1d2939">Callers, calls, transcripts,</text>
<text x="1242" y="570" font-size="10.8" text-anchor="middle" fill="#1d2939">enquiries, handoffs,</text>
<text x="1242" y="585" font-size="10.8" text-anchor="middle" fill="#1d2939">bookings, costs, settings</text>
<rect x="1671" y="624" width="150" height="64" rx="8" fill="#e0f4fb" stroke="#1f9bd0" stroke-width="1.6" />
<text x="1746" y="643" font-size="10.8" text-anchor="middle" fill="#1d2939">Designers&#x27; group:</text>
<text x="1746" y="658" font-size="10.8" text-anchor="middle" fill="#1d2939">handoff + Accept button</text>
<text x="1746" y="673" font-size="10.8" text-anchor="middle" fill="#1d2939">(booked time shown)</text>
<rect x="1839" y="624" width="150" height="64" rx="8" fill="#e0f4fb" stroke="#1f9bd0" stroke-width="1.6" />
<text x="1914" y="643" font-size="10.8" text-anchor="middle" fill="#1d2939">Front desk: complaint,</text>
<text x="1914" y="658" font-size="10.8" text-anchor="middle" fill="#1d2939">missed call, doubtful</text>
<text x="1914" y="673" font-size="10.8" text-anchor="middle" fill="#1d2939">budget / owner / size</text>
<rect x="831" y="624" width="150" height="64" rx="8" fill="#e0f4fb" stroke="#1f9bd0" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="906" y="643" font-size="10.8" text-anchor="middle" fill="#1d2939">Fallback only: caller taps</text>
<text x="906" y="658" font-size="10.8" text-anchor="middle" fill="#1d2939">Start on the bot, shares</text>
<text x="906" y="673" font-size="10.8" text-anchor="middle" fill="#1d2939">number, gets booking link</text>
<rect x="1671" y="712" width="150" height="64" rx="8" fill="#ffeedd" stroke="#e8833a" stroke-width="1.6" />
<text x="1746" y="731" font-size="10.8" text-anchor="middle" fill="#1d2939">Contact for every caller.</text>
<text x="1746" y="746" font-size="10.8" text-anchor="middle" fill="#1d2939">Deal if qualified.</text>
<text x="1746" y="761" font-size="10.8" text-anchor="middle" fill="#1d2939">Moves to Meeting Booked</text>
<rect x="1503" y="800" width="150" height="64" rx="8" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.6" />
<text x="1578" y="819" font-size="10.8" text-anchor="middle" fill="#1d2939">Timer every 5 min:</text>
<text x="1578" y="834" font-size="10.8" text-anchor="middle" fill="#1d2939">nudges, reminders,</text>
<text x="1578" y="849" font-size="10.8" text-anchor="middle" fill="#1d2939">overdue handoffs</text>
<rect x="327" y="800" width="150" height="64" rx="8" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.6" />
<text x="402" y="819" font-size="10.8" text-anchor="middle" fill="#1d2939">Push to GitHub, Vercel</text>
<text x="402" y="834" font-size="10.8" text-anchor="middle" fill="#1d2939">deploys. Instructions</text>
<text x="402" y="849" font-size="10.8" text-anchor="middle" fill="#1d2939">sync with vaani:sync</text>
<rect x="1167" y="888" width="150" height="64" rx="8" fill="#fff0f6" stroke="#c2447e" stroke-width="1.6" />
<text x="1242" y="907" font-size="10.8" text-anchor="middle" fill="#1d2939">Calls, outcomes, costs,</text>
<text x="1242" y="922" font-size="10.8" text-anchor="middle" fill="#1d2939">follow-ups, transcripts.</text>
<text x="1242" y="937" font-size="10.8" text-anchor="middle" fill="#1d2939">Login for 2 admins</text>
<text x="24" y="990" font-size="12.5" font-weight="700" fill="#101828">Not used, by choice:</text>
<text x="160" y="990" font-size="12.5" fill="#344054">no SMS service (the SMS cost line stays at 0; booking happens on the call, Telegram is only the fallback) · no phone number bought (browser test calls get a made-up +915000... number in demo mode) · pricing guide never given to the live agent.</text>
<text x="24" y="1014" font-size="12.5" font-weight="700" fill="#101828">Checks along the way:</text>
<text x="160" y="1014" font-size="12.5" fill="#344054">duplicate webhooks are ignored · every failure alerts the front desk · agent tested with 37 pretend callers · 101 automated tests · repeat calls within 60 minutes merge into one enquiry.</text>
